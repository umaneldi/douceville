services:
  geodb:
    image: postgis/postgis
    user: "0:0"
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U douceville']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./.test_db:/var/lib/postgresql
    environment:
      POSTGRES_DB: douceville
      POSTGRES_USER: douceville
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
