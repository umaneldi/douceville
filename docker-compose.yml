services:
  geotestdb:
    image: postgis/postgis:18-3.7
    user: "0:0"
    restart: unless-stopped
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U douceville']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./.test_db:/var/lib/postgresql
    environment:
      POSTGRES_DB: douceville
      POSTGRES_USER: douceville
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD

  app:
    build: .
    ports:
      - 3566:3566
    profiles: [app]
    restart: unless-stopped
    depends_on:
      geotestdb:
        condition: service_healthy
    environment:
      POSTGRES_HOST: geotestdb
      POSTGRES_PORT: 5432
      POSTGRES_DB: douceville
      POSTGRES_USER: douceville
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      JWT_SECRET: $JWT_SECRET
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-ors}
      OPENROUTESERVICE_KEY: ${OPENROUTESERVICE_KEY:-}
      OPENROUTESERVICE_URL: ${OPENROUTESERVICE_URL:-}
      VALHALLA_URL: ${VALHALLA_URL:-http://valhalla:8002}
      VALHALLA_CONCURRENCY: ${VALHALLA_CONCURRENCY:-8}
      SOURCES_PAR_NATURE: ${SOURCES_PAR_NATURE:-}
      SEARCH_COST_WARNING_CENTS: ${SEARCH_COST_WARNING_CENTS:-200}
      ADDOK_HOST: ${ADDOK_HOST:-}
      LOGLEVEL: ${LOGLEVEL:-INFO}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3566}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      MOLLIE_WEBHOOK_URL: ${MOLLIE_WEBHOOK_URL:-}
      ISOCHRONE_CACHE_DAYS: ${ISOCHRONE_CACHE_DAYS:-30}
      ISOCHRONE_CACHE_MAX: ${ISOCHRONE_CACHE_MAX:-20000}
      OIDC_DEFAULT_PERMS: ${OIDC_DEFAULT_PERMS:-verified}

  # Valhalla (ROUTING_PROVIDER=valhalla) : lit les tuiles locales de
  # ./.valhalla/tiles (/data/tiles). Aucune construction de tuiles ici : elles
  # sont produites par scripts/build_valhalla_tiles.sh, sur une machine de
  # build, puis copiées dans ./.valhalla/tiles (rsync --delete). Le service
  # refuse de démarrer sans tuiles. Démarrage : docker compose --profile
  # valhalla up -d ; après une mise à jour des tuiles : --force-recreate.
  valhalla:
    image: ${VALHALLA_IMAGE:-ghcr.io/valhalla/valhalla:3.9.3}
    profiles: [valhalla]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8002:8002
    volumes:
      - ./.valhalla:/data
    environment:
      VALHALLA_CACHE_BYTES: ${VALHALLA_CACHE_BYTES:-300000000}
      VALHALLA_THREADS: ${VALHALLA_THREADS:-4}
    command:
      - bash
      - -euc
      - |
        if [ -z "$$(find /data/tiles -name '*.gph' 2>/dev/null | head -n 1)" ]; then
          echo "error: no tiles in ./.valhalla/tiles: build them with scripts/build_valhalla_tiles.sh and copy them there" >&2
          exit 1
        fi
        valhalla_build_config \
          --mjolnir-tile-dir /data/tiles --mjolnir-tile-extract '' --mjolnir-traffic-extract '' \
          --mjolnir-use-lru-mem-cache True --mjolnir-max-cache-size "$$VALHALLA_CACHE_BYTES" \
          --mjolnir-admin '' --mjolnir-timezone '' \
          --service-limits-isochrone-max-contours 12 --service-limits-isochrone-max-time-contour 120 \
          > /data/valhalla.json
        exec valhalla_service /data/valhalla.json "$$VALHALLA_THREADS"

networks:
  default:
    external: true
    name: $TRAEFIK_NETWORK
