  app:
    build: .
    ports:
      - 3566:3566
    environment:
      POSTGRES_HOST: douceville-geodb-1
      POSTGRES_PORT: 5432
      POSTGRES_DB: douceville
      POSTGRES_USER: readonly
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      JWT_SECRET: $JWT_SECRET
      OPENROUTESERVICE_KEY: $OPENROUTESERVICE_KEY
      ADDOK_HOST: ${ADDOK_HOST:-}
      LOGLEVEL: ${LOGLEVEL:-INFO}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3566}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

networks:
  default:
    external: true
    name: $TRAEFIK_NETWORK
