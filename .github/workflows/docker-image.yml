name: CI

# À chaque push (branche ou tag) : tests Go, puis construction de l'image Docker.
# L'image n'est publiée sur GHCR que pour un tag commençant par « v » (ex. v1.2.3).
on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  test:
    name: Build and test (Go)
    runs-on: ubuntu-latest
    # PostGIS jetable pour les tests d'intégration de internal/store
    # (chaque test y crée puis supprime sa propre base).
    services:
      postgis:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DV_TEST_DSN: postgres://test:test@localhost:5432/test
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -cover ./...

  docker:
    name: Build Docker image (push on v* tags)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Publication uniquement pour un tag v* (ex. v1.2.3).
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ env.RELEASE == 'true' }}
            type=ref,event=branch
            type=sha

      - name: Build (and push on v* tags) Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.RELEASE == 'true' }}
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
